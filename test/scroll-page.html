<!doctype html><meta charset="utf-8"><title>inner scroll container</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden}
 #scroller{position:relative;height:100%;overflow-y:auto;background:#eef}
 .tall{height:3000px;background:repeating-linear-gradient(180deg,#dde 0 100px,#ccd 100px 200px)}
 .mark{position:absolute;top:300px;left:40px;font:20px system-ui;font-weight:700}
</style>
<div id="scroller"><div class="tall"><div class="mark">MARK</div></div></div>
